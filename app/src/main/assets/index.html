<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#000000" />
<title>ZYE TEAM OFFICIAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   RESET & BASE
   ============================================================ */
*,*::before,*::after{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  height:100%;
  overflow-x:hidden;
}

body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  background:#000;
  color:#fff;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  position:relative;
}

/* ============================================================
   BACKGROUND EFFECT
   ============================================================ */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 50% 0%, rgba(255,255,255,0.08) 0%, transparent 50%),
    radial-gradient(circle at 50% 100%, rgba(255,255,255,0.04) 0%, transparent 60%);
  pointer-events:none;
  z-index:0;
}

body::after{
  content:'';
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size:40px 40px;
  pointer-events:none;
  z-index:0;
  mask-image:radial-gradient(circle at center, black 40%, transparent 80%);
  -webkit-mask-image:radial-gradient(circle at center, black 40%, transparent 80%);
}

/* ============================================================
   CARD CONTAINER
   ============================================================ */
.card{
  position:relative;
  z-index:1;
  width:100%;
  max-width:420px;
  background:rgba(15,15,15,0.6);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:28px;
  padding:40px 28px 32px;
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  box-shadow:
    0 20px 60px rgba(0,0,0,0.8),
    0 0 0 1px rgba(255,255,255,0.03) inset,
    0 1px 0 rgba(255,255,255,0.08) inset;
  text-align:center;
  animation:cardEnter .8s cubic-bezier(.22,.61,.36,1);
}

@keyframes cardEnter{
  from{
    opacity:0;
    transform:translateY(20px) scale(0.98);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.card::before{
  content:'';
  position:absolute;
  top:0;
  left:20%;
  right:20%;
  height:1px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
  border-radius:1px;
}

/* ============================================================
   LOGO
   ============================================================ */
.logo-wrap{
  position:relative;
  width:120px;
  height:120px;
  margin:0 auto 24px;
}

.logo-glow{
  position:absolute;
  inset:-15px;
  background:radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
  border-radius:50%;
  animation:glowPulse 3s ease-in-out infinite;
}

@keyframes glowPulse{
  0%,100%{ opacity:0.5; transform:scale(1); }
  50%{ opacity:1; transform:scale(1.1); }
}

.logo-ring{
  position:absolute;
  inset:-4px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,0.15);
  border-top-color:rgba(255,255,255,0.8);
  animation:ringSpin 6s linear infinite;
}

@keyframes ringSpin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

.logo{
  position:relative;
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
  border:3px solid rgba(255,255,255,0.9);
  box-shadow:
    0 0 30px rgba(255,255,255,0.2),
    0 8px 30px rgba(0,0,0,0.6);
  background:#111;
  display:block;
}

/* ============================================================
   TITLE
   ============================================================ */
.title{
  font-size:32px;
  font-weight:900;
  letter-spacing:-1.2px;
  line-height:1.05;
  background:linear-gradient(180deg, #ffffff 0%, #b8b8b8 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:8px;
  text-transform:uppercase;
}

.subtitle{
  font-size:10px;
  letter-spacing:5px;
  color:#666;
  text-transform:uppercase;
  font-weight:700;
  margin-bottom:32px;
}

.divider{
  width:50px;
  height:2px;
  background:linear-gradient(90deg, transparent, #fff, transparent);
  margin:0 auto 30px;
  border-radius:2px;
  box-shadow:0 0 14px rgba(255,255,255,0.5);
}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
  padding:18px 24px;
  border:none;
  border-radius:16px;
  font-family:inherit;
  font-size:13px;
  font-weight:900;
  letter-spacing:2px;
  text-transform:uppercase;
  cursor:pointer;
  text-decoration:none;
  transition:all .25s cubic-bezier(.22,.61,.36,1);
  user-select:none;
  position:relative;
  overflow:hidden;
  margin-bottom:14px;
}

.btn:last-child{margin-bottom:0}

/* Primary — White Solid */
.btn-primary{
  background:linear-gradient(180deg, #ffffff 0%, #e0e0e0 100%);
  color:#000;
  box-shadow:
    0 8px 24px rgba(255,255,255,0.18),
    0 2px 6px rgba(0,0,0,0.4);
}

.btn-primary:hover{
  transform:translateY(-2px);
  box-shadow:
    0 12px 32px rgba(255,255,255,0.25),
    0 4px 10px rgba(0,0,0,0.5);
}

.btn-primary:active{
  transform:translateY(0) scale(0.98);
}

/* Ghost — Outline */
.btn-ghost{
  background:rgba(255,255,255,0.04);
  color:#fff;
  border:1.5px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.btn-ghost:hover{
  background:rgba(255,255,255,0.09);
  border-color:rgba(255,255,255,0.5);
  transform:translateY(-2px);
}

.btn-ghost:active{
  transform:translateY(0) scale(0.98);
  background:rgba(255,255,255,0.12);
}

/* Dashed — Accent untuk GET KEY */
.btn-dashed{
  background:rgba(255,255,255,0.02);
  color:#fff;
  border:1.5px dashed rgba(255,255,255,0.35);
}

.btn-dashed:hover{
  background:rgba(255,255,255,0.08);
  border-color:rgba(255,255,255,0.7);
  border-style:solid;
  transform:translateY(-2px);
}

.btn-dashed:active{
  transform:translateY(0) scale(0.98);
}

.btn svg{
  width:18px;
  height:18px;
  flex-shrink:0;
}

.btn::before{
  content:'';
  position:absolute;
  top:0;
  left:-100%;
  width:100%;
  height:100%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
  transition:left .6s;
}

.btn:hover::before{
  left:100%;
}

/* ============================================================
   FOOTER
   ============================================================ */
.footer{
  margin-top:30px;
  padding-top:20px;
  border-top:1px solid rgba(255,255,255,0.08);
  font-size:10.5px;
  color:#555;
  letter-spacing:1.5px;
  font-weight:600;
}

.footer span{
  color:#999;
  font-weight:700;
}

/* ============================================================
   DECORATION DOTS
   ============================================================ */
.dots{
  display:flex;
  justify-content:center;
  gap:6px;
  margin-top:16px;
}

.dot{
  width:5px;
  height:5px;
  border-radius:50%;
  background:rgba(255,255,255,0.2);
}

.dot.active{
  background:#fff;
  box-shadow:0 0 8px rgba(255,255,255,0.8);
  animation:dotPulse 1.5s ease-in-out infinite;
}

@keyframes dotPulse{
  0%,100%{opacity:1}
  50%{opacity:0.5}
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:400px){
  .card{padding:32px 22px 26px;border-radius:24px}
  .title{font-size:26px}
  .logo-wrap{width:100px;height:100px;margin-bottom:20px}
  .subtitle{font-size:9px;letter-spacing:4px;margin-bottom:26px}
  .btn{padding:16px 20px;font-size:12px;letter-spacing:1.5px}
}

/* ============================================================
   FLOATING DOTS
   ============================================================ */
.float-dot{
  position:fixed;
  width:3px;
  height:3px;
  background:#fff;
  border-radius:50%;
  opacity:0.15;
  pointer-events:none;
  z-index:0;
  animation:floatMove 20s infinite linear;
}

@keyframes floatMove{
  0%{ transform:translate(0, 0); opacity:0; }
  10%{opacity:0.3}
  90%{opacity:0.3}
  100%{
    transform:translate(var(--dx, 100px), var(--dy, -100vh));
    opacity:0;
  }
}
</style>
</head>
